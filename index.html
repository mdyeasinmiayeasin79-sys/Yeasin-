<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kulfibet Clone</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background-color: #080f1e;
            color: #ffffff;
            padding-bottom: 70px;
        }

        /* Top Navbar */
        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: #0b1528;
            padding: 12px 16px;
            border-bottom: 1px solid #1a2942;
        }

        .logo-container {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .logo-icon {
            width: 32px;
            height: 32px;
            background: #f1c40f;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #000;
            font-weight: bold;
        }

        .logo-text {
            color: #d4af37;
            font-size: 18px;
            font-weight: bold;
        }

        .wallet-btn {
            background-color: #00c853;
            color: white;
            border: 1px solid #1de9b6;
            padding: 6px 14px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 14px;
            box-shadow: 0 0 10px rgba(0, 200, 83, 0.4);
        }

        /* Main Banner */
        .hero {
            background: linear-gradient(180deg, #172439 0%, #0a1324 100%);
            text-align: center;
            padding: 24px 16px;
            margin: 15px;
            border-radius: 16px;
            border: 1px solid #d4af37;
            box-shadow: 0 0 15px rgba(212, 175, 55, 0.15);
        }

        .hero h1 {
            font-size: 24px;
            color: #ffffff;
            margin-bottom: 8px;
        }

        .hero p {
            font-size: 12px;
            color: #a0aec0;
            margin-bottom: 20px;
            line-height: 1.5;
        }

        .btn-deposit {
            width: 100%;
            padding: 12px;
            background: linear-gradient(90deg, #00c853, #1de9b6);
            border: none;
            border-radius: 10px;
            color: #fff;
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 12px;
            box-shadow: 0 0 12px rgba(0, 200, 83, 0.5);
            cursor: pointer;
        }

        .btn-view {
            width: 100%;
            padding: 12px;
            background: transparent;
            border: 1px solid #d4af37;
            color: #d4af37;
            border-radius: 10px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
        }

        /* Stats Section */
        .grid-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            padding: 0 15px;
        }

        .card {
            background-color: #0d1a30;
            border: 1px solid #d4af37;
            border-radius: 12px;
            padding: 14px;
            text-align: center;
            box-shadow: 0 0 10px rgba(212, 175, 55, 0.1);
        }

        .card-title {
            font-size: 10px;
            color: #a0aec0;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 6px;
        }

        .card-value {
            font-size: 18px;
            font-weight: bold;
            color: #f1c40f;
        }

        /* Bottom Nav */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background-color: #0b1426;
            display: flex;
            justify-content: space-around;
            padding: 12px 0;
            border-top: 1px solid #1a2942;
        }

        .nav-item {
            text-align: center;
            color: #718096;
            text-decoration: none;
            font-size: 11px;
        }

        .nav-item.active {
            color: #f1c40f;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <!-- Header Navigation -->
    <div class="navbar">
        <div class="logo-container">
            <div class="logo-icon">KB</div>
            <div class="logo-text">Kulfibet</div>
        </div>
        <button class="wallet-btn">৳ 0.68 +</button>
    </div>

    <!-- Banner Section -->
    <div class="hero">
        <h1>Play Big.<br>Win Bigger.</h1>
        <p>Experience the most advanced betting platform in Bangladesh. Cricket scores, self-hosted games, and instant withdrawals.</p>
        <button class="btn-deposit">+ ডিপোজিট করুন</button>
        <button class="btn-view">VIEW GAMES</button>
    </div>

    <!-- Stats Cards -->
    <div class="grid-container">
        <div class="card">
            <div class="card-title">Active Players</div>
            <div class="card-value">50K+</div>
        </div>
        <div class="card">
            <div class="card-title">Total Payout</div>
            <div class="card-value">৳25M+</div>
        </div>
    </div>

    <!-- Bottom Menu -->
    <div class="bottom-nav">
        <a href="#" class="nav-item active">HOME</a>
        <a href="#" class="nav-item">GAMES</a>
        <a href="#" class="nav-item">রুমে</a>
        <a href="#" class="nav-item">REFERRAL</a>
        <a href="#" class="nav-item">BONUS</a>
    </div>

</body>
</html>
