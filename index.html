<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ওয়েবসাইট টেমপ্লেট</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background-color: #0b1329;
            color: #ffffff;
            padding-bottom: 70px;
        }

        /* Header Options */
        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: #131b2e;
            padding: 12px 16px;
            border-bottom: 1px solid #1e293b;
        }

        .logo {
            color: #f39c12;
            font-size: 20px;
            font-weight: bold;
        }

        .wallet-btn {
            background-color: #27ae60;
            color: white;
            border: none;
            padding: 6px 16px;
            border-radius: 20px;
            font-weight: bold;
            cursor: pointer;
        }

        /* Hero Banner */
        .hero {
            background: linear-gradient(180deg, #162238 0%, #0b1329 100%);
            text-align: center;
            padding: 30px 20px;
            margin: 15px;
            border-radius: 12px;
            border: 1px solid #1e2d4a;
        }

        .hero h1 {
            font-size: 26px;
            color: #ffffff;
            margin-bottom: 10px;
        }

        .hero p {
            font-size: 13px;
            color: #a0aec0;
            margin-bottom: 20px;
            line-height: 1.5;
        }

        .action-btn {
            width: 100%;
            padding: 12px;
            background: linear-gradient(90deg, #00c853, #1de9b6);
            border: none;
            border-radius: 8px;
            color: #fff;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-bottom: 10px;
        }

        .secondary-btn {
            width: 100%;
            padding: 12px;
            background: transparent;
            border: 1px solid #f39c12;
            color: #f39c12;
            border-radius: 8px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
        }

        /* Stats Cards */
        .grid-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            padding: 0 15px;
        }

        .card {
            background-color: #131d31;
            border: 1px solid #23324d;
            border-radius: 10px;
            padding: 15px;
            text-align: center;
        }

        .card-title {
            font-size: 11px;
            color: #8a99ad;
            text-transform: uppercase;
            margin-bottom: 6px;
        }

        .card-value {
            font-size: 18px;
            font-weight: bold;
            color: #f39c12;
        }

        /* Bottom Navigation Bar */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background-color: #0d1627;
            display: flex;
            justify-content: space-around;
            padding: 10px 0;
            border-top: 1px solid #1e293b;
        }

        .nav-item {
            text-align: center;
            color: #718096;
            text-decoration: none;
            font-size: 11px;
        }

        .nav-item.active {
            color: #f39c12;
        }
    </style>
</head>
<body>

    <!-- Header -->
    <div class="navbar">
        <div class="logo">BrandLogo</div>
        <button class="wallet-btn">৳ 0.00 +</button>
    </div>

    <!-- Hero Section -->
    <div class="hero">
        <h1>Play Big. Win Bigger.</h1>
        <p>Experience the most advanced platform in Bangladesh with fast updates and modern UI.</p>
        <button class="action-btn">+ ডিপোজিট করুন</button>
        <button class="secondary-btn">VIEW ALL</button>
    </div>

    <!-- Dashboard Cards -->
    <div class="grid-container">
        <div class="card">
            <div class="card-title">Active Players</div>
            <div class="card-value">50K+</div>
        </div>
        <div class="card">
            <div class="card-title">Total Payout</div>
            <div class="card-value">৳25M+</div>
        </div>
    </div>

    <!-- Bottom Navigation -->
    <div class="bottom-nav">
        <a href="#" class="nav-item active">Home</a>
        <a href="#" class="nav-item">Games</a>
        <a href="#" class="nav-item">Referral</a>
        <a href="#" class="nav-item">Bonus</a>
    </div>

</body>
</html>
