<!-- =========================
     কাজ ১ : COPY - PASTE
========================= -->

<div class="task-box">

<h2>📋 কাজ ১ — Copy & Paste</h2>

<div class="code-box" id="copyCodeText"></div>

<button class="copy" onclick="doCopyCode()">
    📋 Copy
</button>

<input
    type="text"
    id="pasteInput"
    placeholder="এখানে Paste করুন"
>

<button class="verify" onclick="verifyPaste()">
    ✅ Verify
</button>

<div class="message" id="pasteMessage"></div>

</div>

আর তোমার বর্তমান JavaScript-এর পুরো "COPY - PASTE কাজ" অংশটা মুছে এটা বসাবে:

<script>

/* =========================
   COPY - PASTE কাজ
========================= */

let copyText = "";


/* নতুন Copy-Paste নম্বর তৈরি */

function newCopyCode(){

    copyText =
        Math.floor(
            100000 + Math.random() * 900000
        ).toString();

    document.getElementById(
        "copyCodeText"
    ).textContent = copyText;

    document.getElementById(
        "pasteInput"
    ).value = "";

    document.getElementById(
        "pasteMessage"
    ).textContent = "";
}


/* Copy Button */

function doCopyCode(){

    const message =
        document.getElementById("pasteMessage");

    if(navigator.clipboard && window.isSecureContext){

        navigator.clipboard.writeText(copyText)
        .then(function(){

            message.textContent =
                "✅ কোড কপি হয়েছে। এখন Paste করুন।";

        })
        .catch(function(){

            fallbackCopy();

        });

    }else{

        fallbackCopy();

    }
}


/* মোবাইলের জন্য Copy */

function fallbackCopy(){

    const message =
        document.getElementById("pasteMessage");

    const temp =
        document.createElement("textarea");

    temp.value = copyText;

    temp.style.position = "fixed";
    temp.style.left = "-9999px";

    document.body.appendChild(temp);

    temp.focus();
    temp.select();

    try{

        const success =
            document.execCommand("copy");

        if(success){

            message.textContent =
                "✅ কোড কপি হয়েছে। এখন Paste করুন।";

        }else{

            message.textContent =
                "⚠️ Copy হয়নি। কোডটি চেপে ধরে Copy করুন।";

        }

    }catch(error){

        message.textContent =
            "⚠️ Copy হয়নি। কোডটি চেপে ধরে Copy করুন।";

    }

    document.body.removeChild(temp);
}


/* Paste Verify */

function verifyPaste(){

    const value =
        document.getElementById(
            "pasteInput"
        ).value.trim();

    const message =
        document.getElementById(
            "pasteMessage"
        );

    if(value === copyText){

        message.textContent =
            "✅ Copy–Paste কাজ সফল হয়েছে!";

        /* সফল হলে নতুন নম্বর */

        setTimeout(function(){

            newCopyCode();

        }, 1000);

    }else{

        message.textContent =
            "❌ কোড মিলেনি। আবার চেষ্টা করুন।";

    }
}


/* প্রথমবার নতুন নম্বর */

newCopyCode();


/* =========================
   NUMBER CAPTCHA
========================= */

let numberCaptcha = "";

function newNumberCaptcha(){

    numberCaptcha =
        Math.floor(
            100000 + Math.random() * 900000
        ).toString();

    document.getElementById(
        "numberCaptcha"
    ).textContent = numberCaptcha;

    document.getElementById(
        "numberInput"
    ).value = "";

    document.getElementById(
        "numberMessage"
    ).textContent = "";
}

function verifyNumber(){

    const value =
        document.getElementById(
            "numberInput"
        ).value.trim();

    const message =
        document.getElementById(
            "numberMessage"
        );

    if(value === numberCaptcha){

        message.textContent =
            "✅ Number CAPTCHA সঠিক!";

    }else{

        message.textContent =
            "❌ নাম্বার ভুল। আবার চেষ্টা করুন।";

    }
}


/* প্রথমবার CAPTCHA তৈরি */

newNumberCaptcha();

</script>
