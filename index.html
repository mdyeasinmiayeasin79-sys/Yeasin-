<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>দুই ধরনের কাজ</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Arial,sans-serif;
}

body{
    background:#eef2f7;
    padding:15px;
}

.container{
    max-width:480px;
    margin:auto;
}

.header{
    background:#0759c9;
    color:white;
    padding:18px;
    border-radius:12px;
    text-align:center;
    margin-bottom:15px;
}

.header h2{
    font-size:22px;
}

.card{
    background:white;
    padding:18px;
    border-radius:12px;
    margin-bottom:15px;
    box-shadow:0 3px 10px rgba(0,0,0,.08);
}

.card h3{
    margin-bottom:12px;
    color:#222;
}

.copy-area{
    width:100%;
    min-height:80px;
    padding:12px;
    border:2px solid #ddd;
    border-radius:8px;
    background:#f7f7f7;
    font-size:16px;
    line-height:1.6;
    resize:none;
    margin-bottom:10px;
}

input{
    width:100%;
    padding:13px;
    border:2px solid #ddd;
    border-radius:8px;
    font-size:16px;
    outline:none;
    margin-bottom:10px;
}

input:focus{
    border-color:#0759c9;
}

button{
    width:100%;
    padding:13px;
    border:none;
    border-radius:8px;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
    margin-top:5px;
}

.copy-btn{
    background:#16a34a;
    color:white;
}

.submit-btn{
    background:#0759c9;
    color:white;
}

.refresh-btn{
    background:#f59e0b;
    color:white;
}

.message{
    margin-top:10px;
    padding:10px;
    border-radius:8px;
    text-align:center;
    font-weight:bold;
    display:none;
}

.success{
    background:#dcfce7;
    color:#15803d;
}

.error{
    background:#fee2e2;
    color:#dc2626;
}

.captcha-code{
    background:#222;
    color:white;
    padding:15px;
    border-radius:8px;
    text-align:center;
    font-size:25px;
    font-weight:bold;
    letter-spacing:6px;
    margin-bottom:10px;
}
</style>
</head>

<body>

<div class="container">

    <div class="header">
        <h2>💰 অনলাইন কাজ</h2>
    </div>


    <!-- কপি-পেস্ট কাজ -->
    <div class="card">

        <h3>📋 কপি-পেস্ট কাজ</h3>

        <textarea
            id="copyText"
            class="copy-area"
            readonly
        >এই লেখাটি কপি করে নিচের বক্সে পেস্ট করুন</textarea>

        <button
            class="copy-btn"
            onclick="copyText()"
        >
            📋 লেখা কপি করুন
        </button>

        <div
            id="copyStatus"
            class="message"
        ></div>

        <br>

        <input
            type="text"
            id="pasteBox"
            placeholder="এখানে কপি করা লেখা Paste করুন"
            autocomplete="off"
        >

        <button
            class="submit-btn"
            onclick="checkCopyPaste()"
        >
            ✅ জমা দিন
        </button>

        <div
            id="copyMessage"
            class="message"
        ></div>

    </div>


    <!-- CAPTCHA কাজ -->
    <div class="card">

        <h3>🔐 CAPTCHA Verification</h3>

        <div
            id="captchaCode"
            class="captcha-code"
        ></div>

        <button
            class="refresh-btn"
            onclick="generateCaptcha()"
        >
            🔄 নতুন CAPTCHA
        </button>

        <br><br>

        <input
            type="text"
            id="captchaInput"
            placeholder="CAPTCHA লিখুন"
            autocomplete="off"
        >

        <button
            class="submit-btn"
            onclick="checkCaptcha()"
        >
            ✅ CAPTCHA জমা দিন
        </button>

        <div
            id="captchaMessage"
            class="message"
        ></div>

    </div>

</div>


<script>

/* =========================
   কপি-পেস্ট কাজ
========================= */

const originalText =
    "এই লেখাটি কপি করে নিচের বক্সে পেস্ট করুন";


async function copyText(){

    const status =
        document.getElementById("copyStatus");

    try{

        /*
        আধুনিক Clipboard API
        */

        if(
            navigator.clipboard &&
            window.isSecureContext
        ){

            await navigator.clipboard.writeText(
                originalText
            );

            status.className =
                "message success";

            status.innerText =
                "✅ লেখা কপি হয়েছে। এখন নিচের বক্সে চেপে ধরে Paste দিন।";

            status.style.display = "block";

            return;
        }


        /*
        পুরোনো ব্রাউজারের fallback
        */

        const textArea =
            document.createElement("textarea");

        textArea.value = originalText;

        textArea.style.position = "fixed";
        textArea.style.left = "-9999px";

        document.body.appendChild(textArea);

        textArea.focus();
        textArea.select();

        const copied =
            document.execCommand("copy");

        document.body.removeChild(textArea);


        if(copied){

            status.className =
                "message success";

            status.innerText =
                "✅ লেখা কপি হয়েছে। এখন নিচের বক্সে চেপে ধরে Paste দিন।";

        }else{

            status.className =
                "message error";

            status.innerText =
                "❌ কপি হয়নি। লেখাটির উপর চেপে ধরে Copy করুন।";
        }

        status.style.display = "block";

    }
    catch(error){

        status.className =
            "message error";

        status.innerText =
            "❌ স্বয়ংক্রিয় কপি হয়নি। লেখাটির উপর চেপে ধরে Copy করুন।";

        status.style.display = "block";
    }
}


function normalizeText(text){

    return text
        .replace(/\s+/g," ")
        .trim();

}


function checkCopyPaste(){

    const pasteBox =
        document.getElementById("pasteBox");

    const message =
        document.getElementById("copyMessage");

    const userText =
        normalizeText(pasteBox.value);

    const correctText =
        normalizeText(originalText);


    if(userText === ""){

        message.className =
            "message error";

        message.innerText =
            "❌ আগে লেখাটি Paste করুন।";

        message.style.display = "block";

        return;
    }


    if(userText === correctText){

        message.className =
            "message success";

        message.innerText =
            "🎉 সঠিক! কপি-পেস্ট কাজ সম্পন্ন হয়েছে।";

        message.style.display = "block";

    }
    else{

        message.className =
            "message error";

        message.innerText =
            "❌ লেখা সঠিক নয়। পুরো লেখাটি Copy করে Paste করুন।";

        message.style.display = "block";
    }

}


/* =========================
   CAPTCHA
========================= */

let captchaAnswer = "";


function generateCaptcha(){

    const characters =
        "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";

    captchaAnswer = "";

    for(let i = 0; i < 5; i++){

        captchaAnswer +=
            characters.charAt(
                Math.floor(
                    Math.random() * characters.length
                )
            );

    }

    document.getElementById("captchaCode").innerText =
        captchaAnswer;

    document.getElementById("captchaInput").value = "";

    document.getElementById("captchaMessage").style.display =
        "none";
}


function checkCaptcha(){

    const input =
        document.getElementById("captchaInput").value
        .trim()
        .toUpperCase();

    const message =
        document.getElementById("captchaMessage");


    if(input === ""){

        message.className =
            "message error";

        message.innerText =
            "❌ আগে CAPTCHA লিখুন।";

        message.style.display = "block";

        return;
    }


    if(input === captchaAnswer){

        message.className =
            "message success";

        message.innerText =
            "🎉 CAPTCHA সঠিক! কাজ সম্পন্ন হয়েছে।";

        message.style.display = "block";

        setTimeout(
            generateCaptcha,
            1200
        );

    }
    else{

        message.className =
            "message error";

        message.innerText =
            "❌ CAPTCHA ভুল হয়েছে। আবার চেষ্টা করুন।";

        message.style.display = "block";
    }

}


/* প্রথমবার CAPTCHA চালু */
generateCaptcha();

</script>

</body>
  </html>
