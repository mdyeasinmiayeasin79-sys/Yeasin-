<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>দুই ধরনের কাজ</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Arial,sans-serif;
}

body{
    background:#eef2f7;
    padding:15px;
}

.container{
    max-width:480px;
    margin:auto;
}

.header{
    background:linear-gradient(135deg,#0759c9,#0b82f0);
    color:white;
    padding:22px 15px;
    border-radius:16px;
    text-align:center;
    margin-bottom:18px;
    box-shadow:0 5px 15px rgba(0,0,0,.15);
}

.header h1{
    font-size:25px;
    margin-bottom:6px;
}

.header p{
    font-size:14px;
}

.card{
    background:white;
    border-radius:16px;
    padding:20px;
    margin-bottom:15px;
    box-shadow:0 4px 12px rgba(0,0,0,.08);
}

.card h2{
    font-size:20px;
    color:#0759c9;
    margin-bottom:10px;
}

.card p{
    color:#555;
    font-size:14px;
    line-height:1.6;
    margin-bottom:15px;
}

.task-box{
    background:#f5f8fc;
    padding:15px;
    border-radius:12px;
    margin-top:10px;
}

.task-box input{
    width:100%;
    padding:13px;
    border:1px solid #ccd5e0;
    border-radius:9px;
    outline:none;
    font-size:16px;
    margin-bottom:10px;
}

.task-box input:focus{
    border-color:#0759c9;
}

button{
    width:100%;
    padding:13px;
    border:none;
    border-radius:9px;
    background:#0759c9;
    color:white;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
}

button:active{
    transform:scale(.98);
}

.copy-btn{
    background:#12a150;
}

.captcha{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    margin-bottom:10px;
}

.captcha-code{
    flex:1;
    background:#e9eef5;
    border:2px dashed #0759c9;
    border-radius:9px;
    padding:13px;
    text-align:center;
    font-size:23px;
    font-weight:bold;
    letter-spacing:5px;
    user-select:none;
}

.refresh{
    width:55px;
    padding:13px 5px;
    background:#f39c12;
}

.message{
    display:none;
    margin-top:12px;
    padding:11px;
    border-radius:8px;
    text-align:center;
    font-weight:bold;
}

.success{
    display:block;
    background:#d9f8e5;
    color:#087a38;
}

.error{
    display:block;
    background:#ffe0e0;
    color:#c62828;
}

.footer{
    text-align:center;
    color:#777;
    font-size:13px;
    padding:10px;
}
</style>
</head>

<body>

<div class="container">

    <div class="header">
        <h1>💰 অনলাইন কাজ</h1>
        <p>সহজে কাজ করুন — কাজ সম্পন্ন করুন</p>
    </div>

    <!-- কপি পেস্ট কাজ -->
    <div class="card">
        <h2>📋 কপি-পেস্ট কাজ</h2>

        <p>
            নিচের লেখা কপি করে ইনপুট বক্সে পেস্ট করুন।
            তারপর জমা দিন।
        </p>

        <div class="task-box">

            <input
                type="text"
                id="copyText"
                value="এই লেখাটি কপি করে নিচের বক্সে পেস্ট করুন"
                readonly
            >

            <button class="copy-btn" onclick="copyText()">
                📋 লেখা কপি করুন
            </button>

            <br><br>

            <input
                type="text"
                id="pasteBox"
                placeholder="এখানে পেস্ট করুন"
            >

            <button onclick="checkCopyPaste()">
                ✅ কাজ জমা দিন
            </button>

            <div id="copyMessage" class="message"></div>

        </div>
    </div>


    <!-- CAPTCHA কাজ -->
    <div class="card">
        <h2>🔐 CAPTCHA কাজ</h2>

        <p>
            ছবির/বক্সের CAPTCHA কোডটি দেখে নিচের ঘরে লিখুন।
        </p>

        <div class="task-box">

            <div class="captcha">

                <div id="captchaCode" class="captcha-code">
                    A7K9P
                </div>

                <button class="refresh" onclick="generateCaptcha()">
                    🔄
                </button>

            </div>

            <input
                type="text"
                id="captchaInput"
                placeholder="CAPTCHA কোড লিখুন"
                autocomplete="off"
            >

            <button onclick="checkCaptcha()">
                ✅ CAPTCHA জমা দিন
            </button>

            <div id="captchaMessage" class="message"></div>

        </div>
    </div>


    <div class="footer">
        © 2026 অনলাইন কাজ
    </div>

</div>


<script>

/* =========================
   COPY-PASTE
========================= */

function copyText(){

    const text = document.getElementById("copyText").value;

    navigator.clipboard.writeText(text)
    .then(function(){

        alert("✅ লেখা কপি হয়েছে। এখন নিচের বক্সে পেস্ট করুন।");

    })
    .catch(function(){

        const input = document.getElementById("copyText");

        input.removeAttribute("readonly");
        input.select();
        document.execCommand("copy");
        input.setAttribute("readonly","readonly");

        alert("✅ লেখা কপি হয়েছে।");

    });

}


function checkCopyPaste(){

    const original =
        document.getElementById("copyText").value.trim();

    const entered =
        document.getElementById("pasteBox").value.trim();

    const message =
        document.getElementById("copyMessage");

    if(entered === ""){

        message.className = "message error";
        message.innerText = "❌ আগে লেখাটি পেস্ট করুন।";
        return;

    }

    if(entered === original){

        message.className = "message success";
        message.innerText =
            "🎉 সফল! কপি-পেস্ট কাজ সম্পন্ন হয়েছে।";

    }else{

        message.className = "message error";
        message.innerText =
            "❌ লেখা সঠিক নয়। আবার কপি করে পেস্ট করুন।";

    }

}


/* =========================
   CAPTCHA
========================= */

let currentCaptcha = "";


function generateCaptcha(){

    const characters =
        "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";

    let code = "";

    for(let i = 0; i < 5; i++){

        code += characters.charAt(
            Math.floor(Math.random() * characters.length)
        );

    }

    currentCaptcha = code;

    document.getElementById("captchaCode").innerText =
        currentCaptcha;

    document.getElementById("captchaInput").value = "";

    document.getElementById("captchaMessage").className =
        "message";

}


function checkCaptcha(){

    const entered =
        document.getElementById("captchaInput")
        .value
        .trim()
        .toUpperCase();

    const message =
        document.getElementById("captchaMessage");

    if(entered === ""){

        message.className = "message error";
        message.innerText =
            "❌ CAPTCHA কোড লিখুন।";

        return;

    }

    if(entered === currentCaptcha){

        message.className = "message success";
        message.innerText =
            "🎉 CAPTCHA সঠিক! কাজ সম্পন্ন হয়েছে।";

        setTimeout(function(){

            generateCaptcha();

        },1500);

    }else{

        message.className = "message error";
        message.innerText =
            "❌ CAPTCHA ভুল হয়েছে। আবার চেষ্টা করুন।";

    }

}


/* প্রথম CAPTCHA তৈরি */
generateCaptcha();

</script>

</body>
  </html>
