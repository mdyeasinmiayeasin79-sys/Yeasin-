<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>দুই ধরনের কাজ</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Arial,sans-serif;
}

body{
    background:#f1f4f8;
    padding:20px;
}

.container{
    max-width:430px;
    margin:auto;
}

h1{
    text-align:center;
    margin-bottom:20px;
}

.task-box{
    background:white;
    padding:20px;
    margin-bottom:18px;
    border-radius:16px;
    box-shadow:0 4px 15px rgba(0,0,0,.10);
}

.task-box h2{
    margin-bottom:15px;
    font-size:20px;
}

.code-box{
    background:#eeeeee;
    padding:14px;
    border-radius:10px;
    text-align:center;
    font-size:22px;
    font-weight:bold;
    letter-spacing:3px;
    margin-bottom:12px;
}

input{
    width:100%;
    padding:13px;
    border:2px solid #ddd;
    border-radius:10px;
    font-size:17px;
    margin-bottom:10px;
}

button{
    width:100%;
    padding:13px;
    border:0;
    border-radius:10px;
    color:white;
    font-size:16px;
    font-weight:bold;
    margin-top:7px;
}

.copy{
    background:#0759c9;
}

.verify{
    background:#159447;
}

.refresh{
    background:#555;
}

.message{
    text-align:center;
    margin-top:12px;
    font-weight:bold;
}
</style>
</head>

<body>

<div class="container">

<h1>📝 অনলাইন কাজ</h1>


<!-- =========================
     কাজ ১ : COPY - PASTE
========================= -->

<div class="task-box">

<h2>📋 কাজ ১ — Copy & Paste</h2>

<div class="code-box" id="copyCode">
    BANGLA2026
</div>

<button class="copy" onclick="copyCode()">
    📋 Copy
</button>

<input
    type="text"
    id="pasteInput"
    placeholder="এখানে Paste করুন"
>

<button class="verify" onclick="verifyPaste()">
    ✅ Verify
</button>

<div class="message" id="pasteMessage"></div>

</div>



<!-- =========================
     কাজ ২ : NUMBER CAPTCHA
========================= -->

<div class="task-box">

<h2>🔢 কাজ ২ — Number CAPTCHA</h2>

<div class="code-box" id="numberCaptcha"></div>

<input
    type="number"
    id="numberInput"
    placeholder="উপরের নাম্বারটি লিখুন"
>

<button class="verify" onclick="verifyNumber()">
    ✅ Verify
</button>

<button class="refresh" onclick="newNumberCaptcha()">
    🔄 নতুন নাম্বার
</button>

<div class="message" id="numberMessage"></div>

</div>

</div>


<script>

/* =========================
   COPY - PASTE কাজ
========================= */

const copyText = "BANGLA2026";

function copyCode(){

    navigator.clipboard.writeText(copyText)
    .then(function(){

        document.getElementById("pasteMessage").textContent =
        "✅ কোড কপি হয়েছে। এখন Paste করুন।";

    })
    .catch(function(){

        document.getElementById("pasteMessage").textContent =
        "❌ কপি করা যায়নি। কোডটি নিজে লিখুন।";

    });
}


function verifyPaste(){

    const value =
    document.getElementById("pasteInput").value.trim();

    if(value === copyText){

        document.getElementById("pasteMessage").textContent =
        "✅ Copy–Paste কাজ সফল হয়েছে!";

    }else{

        document.getElementById("pasteMessage").textContent =
        "❌ কোড মিলেনি। আবার চেষ্টা করুন।";

    }
}



/* =========================
   NUMBER CAPTCHA
========================= */

let numberCaptcha = "";

function newNumberCaptcha(){

    numberCaptcha =
    Math.floor(100000 + Math.random() * 900000).toString();

    document.getElementById("numberCaptcha").textContent =
    numberCaptcha;

    document.getElementById("numberInput").value = "";

    document.getElementById("numberMessage").textContent = "";
}


function verifyNumber(){

    const value =
    document.getElementById("numberInput").value.trim();

    if(value === numberCaptcha){

        document.getElementById("numberMessage").textContent =
        "✅ Number CAPTCHA সঠিক!";

    }else{

        document.getElementById("numberMessage").textContent =
        "❌ নাম্বার ভুল। আবার চেষ্টা করুন।";

    }
}


/* প্রথমবার CAPTCHA তৈরি */
newNumberCaptcha();

</script>

</body>
</html>
